<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
  <meta name="theme-color" content="#0a1628"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-title" content="J_LAB"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="application-name" content="J_LAB"/>
  <meta name="description" content="J_LAB 회원 안내"/>
  <title>J_LAB 회원안내</title>
  <link rel="manifest" href="./manifest.json"/>
  <link rel="apple-touch-icon" href="./apple-touch-icon.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="./style.css"/>
  <link rel="stylesheet" href="./style_additions.css"/>
</head>
<body>
<div id="app">

  <!-- ══ PWA 설치 배너 ══ -->
  <div id="pwaInstallBanner" style="display:none;">
    <div id="pwaInstallInner">
      <div id="pwaInstallIcon">
        <img src="./icon-192.png" alt="J_LAB" width="36" height="36" onerror="this.style.display='none'"/>
      </div>
      <div id="pwaInstallText">
        <strong>J_LAB 앱으로 설치</strong>
        <span>홈 화면에 추가하면 앱처럼 실행됩니다</span>
      </div>
      <button id="pwaInstallBtn" class="pwa-install-btn">앱으로 설치하기</button>
      <button id="pwaInstallClose" class="pwa-banner-close" aria-label="닫기">✕</button>
    </div>
  </div>

  <!-- ══ PWA 수동 안내 토스트 (iOS Safari 등) ══ -->
  <div id="pwaManualBanner" style="display:none;">
    <div id="pwaManualInner">
      <span id="pwaManualIcon">📲</span>
      <p>휴대폰 브라우저 메뉴에서 <strong>'홈 화면에 추가'</strong>를 눌러<br>J_LAB을 앱처럼 사용할 수 있습니다.</p>
      <button id="pwaManualClose" class="pwa-banner-close">닫기</button>
    </div>
  </div>

  <!-- ══ SIDEBAR ══ -->
  <nav id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-logo" id="brandLogoText">J</div>
      <div class="brand-info">
        <div class="brand-name" id="brandOrgName">J_LAB</div>
        <div class="brand-sub" id="brandOrgSub">회원 안내</div>
      </div>
    </div>
    <div class="sidebar-divider"></div>
    <ul class="sidebar-nav" id="sidebarNav">
      <li>
        <button class="nav-item active" data-page="dashboard">
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></span>
          <span class="nav-label">대시보드</span>
        </button>
      </li>
      <li>
        <button class="nav-item" data-page="notices">
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg></span>
          <span class="nav-label">공지사항</span>
        </button>
      </li>
      <li>
        <button class="nav-item" data-page="events">
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span>
          <span class="nav-label">행사안내</span>
        </button>
      </li>
      <li>
        <button class="nav-item" data-page="gallery">
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></span>
          <span class="nav-label">사진갤러리</span>
        </button>
      </li>
    </ul>
    <div class="sidebar-footer">
      <!-- 사이드바 내 설치 버튼 (PC / 태블릿용) -->
      <button id="pwaInstallSidebar" class="pwa-sidebar-btn" style="display:none;" title="홈 화면에 추가">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M12 2v13M7 10l5 5 5-5"/><path d="M3 18h18v2a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-2z"/></svg>
        앱으로 설치하기
      </button>
      <div class="sync-status">
        <span class="sync-dot" id="syncDot"></span>
        <span class="sync-text" id="syncText">연결 중...</span>
      </div>
      <span class="version-badge" id="versionBadge">v2.3.0</span>
    </div>
  </nav>

  <!-- ══ MAIN WRAP ══ -->
  <div id="mainWrap">

    <!-- 헤더 -->
    <header id="header">
      <button id="menuToggle" class="menu-toggle" aria-label="메뉴 열기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="22" height="22">
          <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
      <div class="header-title-wrap">
        <h1 class="header-title" id="pageTitle">대시보드</h1>
        <span class="header-bc" id="pageBc">홈 / 대시보드</span>
      </div>
      <div class="header-right">
        <button id="btnRefresh" class="hdr-btn" title="새로고침">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
            <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
          </svg>
        </button>
        <!-- 헤더 설치 버튼 (모바일 우측) -->
        <button id="pwaInstallHeader" class="hdr-btn pwa-hdr-btn" style="display:none;" title="앱으로 설치하기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M12 2v13M7 10l5 5 5-5"/><path d="M3 18h18v2a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-2z"/></svg>
        </button>
        <div class="org-pill" id="headerOrgPill">J_LAB</div>
      </div>
    </header>

    <!-- 콘텐츠 -->
    <main id="content">
      <div class="pg-loading">
        <div class="pg-spinner"></div>
        <p class="pg-loading-txt">초기화 중...</p>
      </div>
    </main>

  </div><!-- /#mainWrap -->

  <div id="sidebarOverlay"></div>

  <!-- ══ 하단 탭바 (모바일) ══ -->
  <nav id="bottomNav">
    <button class="bnav-item active" data-page="dashboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      <span>대시보드</span>
    </button>
    <button class="bnav-item" data-page="notices">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/></svg>
      <span>공지사항</span>
    </button>
    <button class="bnav-item" data-page="events">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span>행사안내</span>
    </button>
    <button class="bnav-item" data-page="gallery">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
      <span>갤러리</span>
    </button>
  </nav>

</div><!-- /#app -->

<!-- ══ 공지사항 상세 모달 ══ -->
<div id="noticeModalOverlay" role="dialog" aria-modal="true">
  <div id="noticeModal">
    <div class="nm-hdr">
      <div>
        <div class="nm-title" id="nmTitle">공지사항</div>
        <div class="nm-meta" id="nmMeta"></div>
      </div>
      <button class="modal-close-btn" id="nmClose" aria-label="닫기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="20" height="20">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="nm-body" id="nmBody"></div>
  </div>
</div>

<!-- ══ 사진 확대 모달 ══ -->
<div id="photoModalOverlay" role="dialog" aria-modal="true" aria-label="사진 보기">
  <div id="photoModal">
    <button id="photoModalClose" aria-label="닫기">✕</button>
    <button id="photoModalPrev" class="pm-nav" aria-label="이전 사진">‹</button>
    <img id="photoModalImg" src="" alt="사진"/>
    <button id="photoModalNext" class="pm-nav" aria-label="다음 사진">›</button>
    <div class="pm-info">
      <div id="photoModalTitle"></div>
      <div id="photoModalCaption"></div>
      <div id="photoModalDate"></div>
      <div id="photoModalCount"></div>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast" role="alert" aria-live="polite"></div>

<script src="./config.js"></script>
<script src="./script.js" onerror="document.getElementById('content').innerHTML='<div class=\'pg-loading\'><div style=\'font-size:2rem;margin-bottom:12px\'>⚠️</div><p>script.js 로드 실패<br><small>GitHub Pages 배포 후 1~2분 대기 후 새로고침</small></p></div>';"></script>
</body>
</html>
